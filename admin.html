<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin</title><link rel="stylesheet" href="styles.css"></head><body><div id="nav"></div><main><section class="panel"><h2>Data Tools</h2><p class="notice"><b>v4:</b> Backup exports Supabase transactions. Import creates new rows. Template gives the expected CSV format.</p><div class="grid-3"><button class="primary" id="backupBtn">Backup</button><button id="importBtn">Import</button><button id="templateBtn">Template</button></div><input type="file" id="importFile" accept=".csv" hidden></section><section class="panel"><h2>Merge Customers</h2><p class="notice">Both fields search existing customer names as you type.</p><div class="grid-3"><label>Customer Name to Merge<input id="mergeOld" list="customerList"></label><label>Correct Customer Name<input id="mergeNew" list="customerList"></label><button class="primary" id="mergeBtn">Merge Customers</button></div></section><section class="panel"><h2>Rename Customer</h2><div class="grid-3"><label>Current Customer Name<input id="renameOld" list="customerList"></label><label>New Customer Name<input id="renameNew"></label><button class="primary" id="renameBtn">Rename Customer</button></div><datalist id="customerList"></datalist></section><section class="panel"><h2>Customer Search Preview</h2><input id="search" placeholder="Search customers..." style="width:100%;margin-bottom:10px"><div class="table-wrap"><table id="customerTable"><thead><tr><th>Name</th><th>Rows</th><th>Last Date</th></tr></thead><tbody></tbody></table></div></section></main><div id="footer"></div><script src="config.js"></script><script src="common.js"></script><script src="admin.js"></script></body></html>
