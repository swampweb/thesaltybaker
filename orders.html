<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Order Capture</title><link rel="stylesheet" href="styles.css"></head><body><div id="nav"></div><main>
<section class="panel"><div class="panel-head"><div><h2>Order Capture</h2><p class="hint">Keep the paper order sheets. Use this page to capture a photo, enter/confirm the order, then post it to Finance when paid.</p></div><div class="filters"><select id="statusFilter"><option value="all">All Orders</option><option>Open</option><option>Ready</option><option>Picked Up</option><option>Paid</option><option>Posted to Finance</option><option>Cancelled</option></select></div></div><p class="notice"><b>Best flow:</b> Photo or quick text → Review fields → Save Order → Post to Finance. This avoids retyping the order into the Dashboard.</p></section>
<section class="panel"><h2>New / Edit Order</h2><form id="orderForm" class="grid-4"><input type="hidden" id="orderId"><label>Order Date<input id="orderDate" type="date"></label><label>Pickup Date<input id="pickupDate" type="date"></label><label>Customer Name<input id="customerName"></label><label>Media Source<select id="mediaSource"><option></option><option>Messenger</option><option>Facebook</option><option>Text</option><option>Phone</option><option>In Person</option><option>Other</option></select></label><label>Payment<select id="paymentType"><option></option><option>Apple</option><option>Cash</option><option>Cash App</option><option>Paypal</option><option>Square</option><option>Venmo</option><option>Zelle</option><option>Other</option></select></label><label>Total Amount<input id="totalAmount" type="number" step="0.01"></label><label>Status<select id="status"><option>Open</option><option>Ready</option><option>Picked Up</option><option>Paid</option><option>Posted to Finance</option><option>Cancelled</option></select></label><label>Order Photo<input id="photoInput" type="file" accept="image/*"></label><label class="full">Quick Text / Notes Parser<textarea id="quickText" placeholder="Paste or type from paper sheet. Example: Name: Kurstan Polkey, Date: 6/28, P/U Date: 7/31, Media Source: Messenger, Details: 2 dozen mermaid theme, Total: $72"></textarea></label><div class="full"><button type="button" id="parseBtn">Fill From Quick Text</button> <button class="primary" type="submit">Save Order</button> <button type="button" id="clearBtn">Clear</button></div><label class="full">Details<textarea id="details"></textarea></label><div class="full" id="photoPreviewWrap"></div></form></section>
<section class="panel"><h2>Orders</h2><div id="ordersList"></div></section>
</main><div id="footer"></div><script src="config.js"></script><script src="common.js"></script><script src="orders.js"></script></body></html>
